<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Induló · Kids Outfit</title>
<style>body{margin:0;background:#f2f1e9;color:#27443f;font-family:system-ui,sans-serif}main{max-width:1040px;margin:36px auto;padding:0 20px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}label{font-size:12px;font-weight:600;display:grid;gap:5px}select{padding:10px;border:1px solid #cbd6c8;border-radius:10px;background:#fffdf7;color:#27443f;font:inherit;min-height:42px}h1{font-size:38px;letter-spacing:-.05em;margin:8px 0}p{color:#596c61;line-height:1.6}.overline{font-size:11px;letter-spacing:.2em;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}.notice{font-size:12px}footer{font-size:12px;margin:30px 0;color:#596c61}@media(max-width:650px){main{margin:22px auto;padding:0 12px}.grid{grid-template-columns:1fr}h1{font-size:30px}nav{gap:8px}}</style>
<main><div class="overline">ZSÁKLAK · HOME ASSISTANT</div><h1>Egy pillantás. És indulhatunk.</h1><p>A naphoz illő ruha, a gyerekek nyelvén. Interaktív kártyabemutató.</p>
<nav><label>Időjárás / Weather<select id="scenario"><option value="rain">Hűvös reggel, esős délután</option><option value="winter">Téli nap</option><option value="hot">Napos nap · szalmakalap</option><option value="cap">Napos nap · baseballsapka</option><option value="layers">Hűvös reggel, meleg délután</option><option value="storm">Zivatar és szél</option><option value="swim">Úszós program</option><option value="daily">Napi előrejelzés</option><option value="tights">Harisnya a nadrág alá</option><option value="setup">Beállítási segítség</option><option value="missing">Nincs friss adat</option></select></label><label>Nyelv / Language<select id="language"><option value="bg">Български</option><option value="cs">Čeština</option><option value="da">Dansk</option><option value="de">Deutsch</option><option value="el">Ελληνικά</option><option value="en">English</option><option value="es">Español</option><option value="et">Eesti</option><option value="fi">Suomi</option><option value="fr">Français</option><option value="ga">Gaeilge</option><option value="hr">Hrvatski</option><option value="hu" selected>Magyar</option><option value="it">Italiano</option><option value="lt">Lietuvių</option><option value="lv">Latviešu</option><option value="mt">Malti</option><option value="nl">Nederlands</option><option value="pl">Polski</option><option value="pt">Português</option><option value="ro">Română</option><option value="sk">Slovenčina</option><option value="sl">Slovenščina</option><option value="sv">Svenska</option><option value="ar">العربية</option><option value="hi">हिन्दी</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option></select></label></nav>
<div class="grid"><kids-outfit-card id="boy"></kids-outfit-card><kids-outfit-card id="girl"></kids-outfit-card></div><footer>Bemutatóadatok · A rajz és a kártya megegyezik a telepíthető változattal.</footer></main>
<script type="module">
import '../dist/kids-outfit-card.js';
const fixtures=await (await fetch('./fixtures.json')).json();
// Keep the sample school day valid regardless of when the demo is opened.
function demoWindow(){
 const reference=new Date(Date.now()+86400000);
 const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Budapest',year:'numeric',month:'2-digit',day:'2-digit',timeZoneName:'longOffset'}).formatToParts(reference).map(p=>[p.type,p.value]));
 const date=`${parts.year}-${parts.month}-${parts.day}`;
 const offset=parts.timeZoneName.replace('GMT','')||'+00:00';
 return {window_start:`${date}T07:30:00${offset}`,window_end:`${date}T16:00:00${offset}`,target_date:date};
}
window.showScenario=()=>{
 const scenario=document.querySelector('#scenario').value,language=document.querySelector('#language').value;
 for(const sex of ['boy','girl']){
  const attributes={...fixtures[['missing','setup'].includes(scenario)?'rain':scenario],...demoWindow(),character:sex,name:({ar:['سامي','ليلى'],hi:['आरव','मीरा'],'zh-Hans':['小明','小美'],'zh-Hant':['小明','小美']}[language]||['Misi','Lili'])[sex==='boy'?0:1],updated_at:new Date().toISOString(),valid_until:new Date(Date.now()+45*60000).toISOString()};
  const card=document.querySelector('#'+sex);card.setConfig({entity:scenario==='setup'?undefined:'sensor.demo',language,compact:new URLSearchParams(location.search).has('tablet'),translations:{}});
  card.hass={language,locale:{language},config:{time_zone:'Europe/Budapest',unit_system:{temperature:'°C'}},states:scenario==='setup'?{}:{'sensor.demo':{state:scenario==='missing'?'unavailable':attributes.outfit,attributes}}};
 }
};
document.querySelectorAll('select').forEach(el=>el.addEventListener('change',window.showScenario));window.showScenario();
</script></html>
